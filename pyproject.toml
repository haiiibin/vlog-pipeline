[project]
name = "vlog-pipeline"
version = "0.1.0"
description = "Personal vlog auto-edit pipeline"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "scenedetect[opencv]>=0.6.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "librosa>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    # upstream fastapi/starlette testclient deprecation; revisit on next starlette bump
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # librosa's audioread dependency imports stdlib modules slated for removal in 3.13;
    # revisit when audioread drops the fallback or the project bumps past 3.13
    "ignore:'aifc' is deprecated and slated for removal in Python 3.13",
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13",
    "ignore:'sunau' is deprecated and slated for removal in Python 3.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"
